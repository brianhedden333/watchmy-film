# /etc/nginx/sites-available/watchmyfilm  (symlink into sites-enabled)
# Static site from /var/www/watchmyfilm/site; /api and /uploads go to the Node API on 127.0.0.1:5050.
# Certbot adds the HTTPS (443) blocks to this file: sudo certbot --nginx -d watchmyfilm.online -d www.watchmyfilm.online

server {
    listen 80;
    listen [::]:80;
    server_name watchmyfilm.online www.watchmyfilm.online;

    root /var/www/watchmyfilm/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 12m; # poster uploads (API allows 10 MB)

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Posters are served straight from disk.
    location /uploads/ {
        alias /var/www/watchmyfilm/server/uploads/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /signup -> /signup/ etc.; unknown paths 404 (each page has its own index.html).
    location / {
        try_files $uri $uri/ =404;
    }
}
