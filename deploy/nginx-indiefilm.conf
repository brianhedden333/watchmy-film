# /etc/nginx/sites-available/indiefilm  (symlink into sites-enabled)
# indiefilm.club — the viewer site: Browse is its home page; My Library and viewer sign-in live here too.
# Same built site and API as watchmyfilm.online. Films are at <name>.indiefilm.club (nginx-indiefilm-films.conf).
# Needs: Cloudflare DNS for indiefilm.club (A records "@", "www" and "*" -> droplet, proxied), SSL mode Full (strict),
# and a Cloudflare Origin Certificate for indiefilm.club + *.indiefilm.club at the two paths below.

server {
    listen 80;
    listen [::]:80;
    server_name indiefilm.club www.indiefilm.club;
    return 301 https://indiefilm.club$request_uri;
}

# www -> the bare domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.indiefilm.club;
    ssl_certificate /etc/ssl/indiefilm/origin.pem;
    ssl_certificate_key /etc/ssl/indiefilm/origin.key;
    return 301 https://indiefilm.club$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name indiefilm.club;

    ssl_certificate /etc/ssl/indiefilm/origin.pem;
    ssl_certificate_key /etc/ssl/indiefilm/origin.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /var/www/watchmyfilm/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Home page: Browse.
    location = / {
        try_files /browse/index.html =404;
    }

    # The old Browse address -> the home page. Browse's own files (e.g. /browse/video-store.jpg) still load.
    location = /browse/ {
        return 301 /;
    }
    location = /browse {
        return 301 /;
    }

    # Filmmaker pages live on watchmyfilm.online: pass through the sign-in hop so they arrive signed in.
    location ~ ^/(signup|dashboard|add-a-film|admin|account|preview|workflow|sample)(/|$) {
        return 302 /api/auth/hop?next=https://watchmyfilm.online$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/watchmyfilm/server/uploads/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /brand/ {
        expires 7d;
    }

    # /library/, /signin/, /terms/, /privacy/ (each has its own index.html); anything else 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}
