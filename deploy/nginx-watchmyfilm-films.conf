# /etc/nginx/sites-available/watchmyfilm-films  (symlink into sites-enabled)
# Films moved to <name>.indiefilm.club. Any old <name>.watchmyfilm.online address forwards to the same name there.
# (watchmyfilm.online and www keep their own block; exact names win over this pattern.)
# Uses the existing Cloudflare Origin Certificate for watchmyfilm.online + *.watchmyfilm.online.

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<film>[a-z0-9-]+)\.watchmyfilm\.online$;
    return 301 https://$film.indiefilm.club$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?<film>[a-z0-9-]+)\.watchmyfilm\.online$;

    ssl_certificate /etc/ssl/watchmyfilm/origin.pem;
    ssl_certificate_key /etc/ssl/watchmyfilm/origin.key;

    return 301 https://$film.indiefilm.club$request_uri;
}
