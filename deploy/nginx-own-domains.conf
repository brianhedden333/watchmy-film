# /etc/nginx/sites-available/own-domains  (symlink into sites-enabled)
# Filmmakers' own domains (watch.theirfilm.com). They reach us through Cloudflare for SaaS (Custom Hostnames on the
# indiefilm.club zone); this catch-all takes any host none of our other blocks name, and the API forwards it (301) to
# the film's <name>.indiefilm.club address, the one viewers and search engines see. Unknown hosts get "film not found".
#
# Cloudflare connects with the filmmaker's hostname, which our origin certificate can't cover, so the indiefilm.club
# zone has a Configuration Rule setting SSL to "Full" (still encrypted, certificate name not checked) for hostnames
# that don't end in indiefilm.club. Our own sites keep Full (strict).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Every path goes to the page handler (query kept), which forwards to the film's indiefilm.club address.
    location / {
        rewrite ^ /api/watch/page break;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/indiefilm/origin.pem;
    ssl_certificate_key /etc/ssl/indiefilm/origin.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    location / {
        rewrite ^ /api/watch/page break;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
