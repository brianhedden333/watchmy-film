# /etc/nginx/sites-available/indiefilm-films  (symlink into sites-enabled)
# Every film's own address: <name>.indiefilm.club. One wildcard block; nothing to do per film.
# Needs: Cloudflare DNS "*" A record -> droplet (proxied), and the Cloudflare Origin Certificate for
# indiefilm.club + *.indiefilm.club at the two paths below. indiefilm.club and www have their own block
# (nginx-indiefilm.conf; exact names win over the wildcard).

server {
    listen 80;
    listen [::]:80;
    server_name *.indiefilm.club;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # (No http2 line: nginx 1.18 on the droplet. Cloudflare serves visitors over HTTP/2 regardless.)
    server_name *.indiefilm.club;

    ssl_certificate /etc/ssl/indiefilm/origin.pem;
    ssl_certificate_key /etc/ssl/indiefilm/origin.key;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /var/www/watchmyfilm/site;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The page: the API fills in the film's title and image (for link previews) and inlines its data.
    location = / {
        proxy_pass http://127.0.0.1:5050/api/watch/page;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/watchmyfilm/server/uploads/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /brand/ {
        expires 7d;
    }

    # Anything else on a film's address goes to its page.
    location / {
        return 302 /;
    }
}
